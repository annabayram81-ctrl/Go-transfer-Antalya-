<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Страница маршрута GoTransfer готовится." />
    <title>Маршрут готовится — GoTransfer</title>
    <meta name="theme-color" content="#111316" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=20260728-pwa-58" />
    <link rel="stylesheet" href="/routes.css?v=20260727-pwa-50" />
  </head>
  <body class="route-placeholder-page">
    <main class="route-placeholder">
      <a class="brand" href="/" aria-label="GoTransfer — главная">
        <span class="brand__text"><span>GoTransfer</span></span>
      </a>
      <section>
        <p>Новый VIP-маршрут</p>
        <h1>Маршрут готовится.</h1>
        <span>Скоро здесь появятся интересные остановки и варианты поездки.</span>
        <a href="/routes">Вернуться к направлениям <b aria-hidden="true">→</b></a>
      </section>
    </main>
    <button class="mobile-back-button" id="mobileBackButton" type="button" aria-label="Вернуться назад">← <span>Назад</span></button>
    <script src="/site-locale.js?v=20260729-i18n-1"></script>
    <script type="module">
      import { getLanguage, setupBackButton } from "/journey-language.js?v=20260729-i18n-1";
      const copy = {
        ru: ["Новый VIP-маршрут", "Маршрут готовится.", "Скоро здесь появятся интересные остановки и варианты поездки.", "Вернуться к направлениям", "Назад"],
        en: ["New VIP route", "This route is being prepared.", "Interesting stops and travel options will appear here soon.", "Back to destinations", "Back"],
        tr: ["Yeni VIP rota", "Bu rota hazırlanıyor.", "Yakında burada ilginç duraklar ve yolculuk seçenekleri yer alacak.", "Rotalara dön", "Geri"],
        de: ["Neue VIP-Route", "Diese Route wird vorbereitet.", "Bald finden Sie hier besondere Stopps und individuelle Reiseoptionen.", "Zurück zu den Zielen", "Zurück"],
        ar: ["مسار جديد لكبار الشخصيات", "نعمل على إعداد هذا المسار.", "ستجد هنا قريباً محطات مميزة وخيارات خاصة للرحلة.", "العودة إلى الوجهات", "رجوع"],
      };
      const language = getLanguage();
      const text = copy[language];
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      const section = document.querySelector(".route-placeholder section");
      section.querySelector("p").textContent = text[0];
      section.querySelector("h1").textContent = text[1];
      section.querySelector("span").textContent = text[2];
      section.querySelector("a").childNodes[0].textContent = `${text[3]} `;
      document.querySelector("#mobileBackButton span").textContent = text[4];
      setupBackButton(document.querySelector("#mobileBackButton"), "/routes");
    </script>
  </body>
</html>
